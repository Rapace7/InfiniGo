# ============================================================
#  在 GitHub 的 macOS 机器上打包 macOS 版
#
#  为什么需要这个：
#    **Windows 上做不出 macOS 包** —— electron-builder 明确不支持跨平台打 mac
#    （实测报错：「Build for macOS is supported only on macOS」）。
#    而我们没有 Mac 机器，所以借 GitHub Actions 的免费 macOS runner。
#
#  ★ 产出的是**未签名**包，用户第一次打开会被 Gatekeeper 拦。
#    所以这里显式关掉签名自动探测：
#      CSC_IDENTITY_AUTO_DISCOVERY=false → 不去找证书、直接出未签名包（否则会报错退出）
#      hardenedRuntime / gatekeeperAssess 已在 package.json 的 build.mac 里关掉
#    正式签名公证要 Apple Developer 账号（$99/年），暂时不做。
#
#  ★★ 为什么**只手动触发、不自动发 Release**（2026-10-09 定）：
#    Windows 包是本地打的，Mac 包在这里打。如果这里也去发 Release，
#    就会和本地发布**抢同一个 Release** —— 顺序一乱，资产就被覆盖或漏掉。
#    所以分工：**这里只产出 artifact（产物），发布统一由本地做。**
#    流程：手动跑这个 workflow → 本地 `gh run download` 取回 zip → 本地一次性发 Release
#
#  怎么用：
#    仓库页 → Actions → 「Build macOS」→ Run workflow
#    跑完在 Actions 页面能下 artifact；本地也可 `gh run download <run-id>`
# ============================================================
name: Build macOS

on:
  # 只手动触发（见上面「为什么」）
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: npm ci || npm install

      - name: 打包（arm64 + x64 两个架构，未签名）
        env:
          # ★ 关键：不去找签名证书。没有它，electron-builder 会尝试签名然后失败。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # ★★ --publish never 是必须的（2026-10-09 第一次跑就栽在这）：
        #    electron-builder 一旦发现自己在 CI 里，就会**自动去发布 GitHub Release**；
        #    我们没给 GH_TOKEN，于是它在**包已经打好之后**报错退出：
        #      ⨯ GitHub Personal Access Token is not set, neither programmatically, nor using env "GH_TOKEN"
        #    结果：zip 明明生成好了，整个 job 却是红的。
        #    发布由本地做（见文件头说明）。
        run: npx electron-builder --mac --publish never

      - name: 看看产出了什么
        run: ls -lh dist/*.zip

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: RapaceGo-mac
          path: dist/*.zip
          if-no-files-found: error
